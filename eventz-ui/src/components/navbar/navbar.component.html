<header class="sticky top-0 z-40 border-b border-border-light bg-white/[.92] backdrop-blur-md">
  <div class="mx-auto flex h-20 max-w-[1280px] items-center gap-7 px-6 md:px-8">
    <a routerLink="/" class="flex shrink-0 items-center gap-2">
      <span class="flex h-[30px] w-[30px] items-center justify-center rounded-lg bg-brand text-sm font-extrabold text-white">E</span>
      <span class="text-[19px] font-extrabold tracking-[-.01em] text-text-primary">Eventz</span>
    </a>

    @if (variant === 'landing') {
      <nav class="hidden items-center gap-7 text-[14.5px] font-semibold md:flex">
        <a routerLink="/" class="text-brand">Discover Events</a>
        <a href="#categories" class="text-text-nav">Categories</a>
        <a href="#how-it-works" class="text-text-nav">How It Works</a>
      </nav>
      <div class="flex-1"></div>
      <button type="button" class="hidden items-center gap-2 rounded-[10px] border border-border px-3.5 py-2 text-sm text-text-tertiary transition-colors hover:border-border-hover md:flex">
        <ng-icon name="lucideSearch" size="15" color="#8A8A9E" />
        Search events
      </button>
      <a routerLink="/login" class="hidden text-[14.5px] font-semibold text-text-nav md:block">Sign In</a>
      <a z-button routerLink="/login" class="shadow-brand-cta">Host an Event</a>
    } @else if (variant === 'account') {
      <nav class="hidden items-center gap-7 text-[14.5px] font-semibold md:flex">
        <a routerLink="/" class="text-text-nav">Discover Events</a>
        <a routerLink="/tickets" class="text-text-nav">My tickets</a>
        <a routerLink="/account" class="text-brand">Saved</a>
      </nav>
      <div class="flex-1"></div>
      <button type="button" class="relative flex h-9 w-9 items-center justify-center rounded-full hover:bg-brand-tint" aria-label="Notifications">
        <ng-icon name="lucideBell" size="18" color="#4A4A5C" />
        <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-brand"></span>
      </button>
      <div class="flex h-[34px] w-[34px] items-center justify-center rounded-full border border-brand-border bg-brand-tint text-[13px] font-bold text-brand">JM</div>
    } @else {
      <div class="flex-1"></div>
      <a z-button zType="outline" routerLink="/tickets">My tickets</a>
      <a routerLink="/account" class="flex items-center gap-1.5">
        <span class="flex h-[34px] w-[34px] items-center justify-center rounded-full border border-brand-border bg-brand-tint text-[13px] font-bold text-brand">JM</span>
        <ng-icon name="lucideChevronDown" size="14" color="#8A8A9E" />
      </a>
    }
  </div>
</header>
