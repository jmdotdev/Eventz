<app-admin-page-header
  [title]="showEventsTable ? 'Events' : 'Organizers'"
  [subtitle]="showEventsTable ? '14 events · 6 upcoming · 2 drafts' : 'Organizers running events on Eventz'"
>
  <div class="flex gap-1 rounded-[11px] bg-brand-tint p-1">
    <button
      type="button"
      (click)="toggleShowEvents(true)"
      class="rounded-lg px-3.5 py-1.5 text-[13px] font-bold transition-colors"
      [class]="showEventsTable ? 'bg-white text-brand shadow-sm' : 'text-text-secondary'"
    >Events</button>
    <button
      type="button"
      (click)="toggleShowEvents(false)"
      class="rounded-lg px-3.5 py-1.5 text-[13px] font-bold transition-colors"
      [class]="!showEventsTable ? 'bg-white text-brand shadow-sm' : 'text-text-secondary'"
    >Organizers</button>
  </div>
  <button type="button" (click)="navigateToAddEvent()" class="flex items-center gap-1.5 rounded-[10px] bg-brand px-4 py-2.5 text-[13.5px] font-bold text-white hover:bg-brand-hover">
    <ng-icon name="lucidePlus" size="14" />
    {{ showEventsTable ? 'Add Event' : 'Add Organizer' }}
  </button>
</app-admin-page-header>
