<div class="flex items-center justify-between border-t border-divider bg-surface-muted px-6 py-3.5">
  <span class="text-[13px] text-text-tertiary">{{ rangeLabel }}</span>
  <div class="flex gap-2">
    <button
      type="button"
      (click)="pageChange.emit(currentPage - 1)"
      [disabled]="currentPage === 1"
      class="rounded-[9px] border border-border bg-white px-3 py-1.5 text-[13px] font-semibold text-text-primary disabled:cursor-not-allowed disabled:opacity-50"
    >Previous</button>
    <button
      type="button"
      (click)="pageChange.emit(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      class="rounded-[9px] border border-border bg-white px-3 py-1.5 text-[13px] font-semibold text-text-primary disabled:cursor-not-allowed disabled:opacity-50"
    >Next</button>
  </div>
</div>
