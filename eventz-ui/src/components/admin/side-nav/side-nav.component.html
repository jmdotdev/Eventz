<div class="flex h-full flex-col gap-5 bg-white p-4">
  <a routerLink="/" class="flex items-center gap-2 rounded-lg px-2 py-1">
    <span class="flex h-[30px] w-[30px] items-center justify-center rounded-[9px] bg-brand text-sm font-extrabold text-white">E</span>
    <span class="text-[18px] font-extrabold tracking-[-.02em] text-text-primary">Eventz</span>
    <span class="rounded-md bg-brand-tint px-[7px] py-[3px] text-[10px] font-bold uppercase tracking-[.04em] text-brand">Organizer</span>
  </a>

  <nav class="flex flex-col gap-1">
    @for (link of links; track link.name) {
      <a
        [routerLink]="link.path ? ['/admin', link.path] : ['/admin']"
        (click)="onLinkClick()"
        class="flex items-center gap-2.5 rounded-[11px] px-3 py-2.5 text-[14px] font-semibold transition-colors"
        [class]="isActive(link) ? 'bg-brand-tint text-brand' : 'text-text-nav hover:bg-brand-tint hover:text-brand'"
      >
        <ng-icon [name]="link.icon" size="17" [strokeWidth]="1.9" />
        <span class="flex-1">{{ link.name }}</span>
        @if (link.badge) {
          <span class="ml-auto rounded-md bg-brand-tint px-[7px] py-0.5 text-[11px] font-bold text-brand">{{ link.badge }}</span>
        }
      </a>
    }
  </nav>

  <div class="flex-1"></div>

  <div class="rounded-2xl bg-brand-tint p-4">
    <p class="text-[13.5px] font-bold text-text-primary">Next payout</p>
    <p class="text-[20px] font-extrabold text-brand">KES 486,200</p>
    <p class="text-[12.5px] text-text-secondary">Friday, 21 Aug · M-Pesa</p>
    <a routerLink="/admin/payouts" (click)="onLinkClick()" class="mt-2.5 block w-full rounded-[9px] bg-white py-2 text-center text-[13px] font-bold text-brand">View payouts</a>
  </div>

  <div class="flex items-center gap-2.5 border-t border-divider px-2 pt-2.5">
    <span class="flex h-[34px] w-[34px] items-center justify-center rounded-[11px] bg-brand text-[13px] font-bold text-white">JM</span>
    <div>
      <p class="text-[13.5px] font-bold text-text-primary">John Mwangi</p>
      <p class="text-[12px] text-text-tertiary">Sondeka Ltd</p>
    </div>
  </div>
</div>
