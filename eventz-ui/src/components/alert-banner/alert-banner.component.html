<div [class]="containerClasses()">
  <span class="flex h-[30px] w-[30px] shrink-0 items-center justify-center rounded-[9px]" [class]="badgeClasses()">
    <ng-icon [name]="icon()" size="15" color="#fff" />
  </span>
  <span class="flex-1">
    @if (title) {
      <span [class]="titleClasses()">{{ title }}</span>
    }
    <span [class]="messageClasses()">{{ message }}</span>
  </span>
</div>
