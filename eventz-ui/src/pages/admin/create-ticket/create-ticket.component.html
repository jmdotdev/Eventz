<div class="px-5 pb-14 pt-6 sm:px-8">
  <app-admin-page-header title="Create ticket" subtitle="Add a new ticket type to one of your events." />

  <div class="mx-auto max-w-xl rounded-[18px] border border-border-light bg-white p-6">
    <form [formGroup]="form" class="flex flex-col gap-4">
      <label class="block">
        <span class="mb-1.5 block text-[13.5px] font-bold text-text-primary">Event</span>
        <select formControlName="event" class="w-full rounded-xl border border-border bg-surface-muted px-3.5 py-3 text-[14.5px] outline-none focus:border-brand focus:bg-white">
          <option value="" disabled selected>Select event</option>
          <option>Nairobi Music Festival 2026</option>
          <option>Nairobi Tech Summit 2026</option>
          <option>AfroFuture Live</option>
        </select>
      </label>
      <label class="block">
        <span class="mb-1.5 block text-[13.5px] font-bold text-text-primary">No. of tickets</span>
        <input formControlName="quantity" type="number" placeholder="Enter number of tickets" class="w-full rounded-xl border border-border bg-surface-muted px-3.5 py-3 text-[14.5px] outline-none focus:border-brand focus:bg-white" />
      </label>
      <label class="block">
        <span class="mb-1.5 block text-[13.5px] font-bold text-text-primary">Category</span>
        <select formControlName="category" class="w-full rounded-xl border border-border bg-surface-muted px-3.5 py-3 text-[14.5px] outline-none focus:border-brand focus:bg-white">
          <option value="" disabled selected>Select category</option>
          <option>Early Bird</option>
          <option>Regular</option>
          <option>VIP</option>
        </select>
      </label>
      <label class="block">
        <span class="mb-1.5 block text-[13.5px] font-bold text-text-primary">Ticket cost (KES)</span>
        <input formControlName="cost" type="number" placeholder="Enter ticket cost" class="w-full rounded-xl border border-border bg-surface-muted px-3.5 py-3 text-[14.5px] outline-none focus:border-brand focus:bg-white" />
      </label>
      <button type="submit" [disabled]="form.invalid" class="mt-2 w-full rounded-xl bg-brand py-3 text-[14.5px] font-bold text-white disabled:cursor-not-allowed disabled:opacity-50">Create ticket</button>
    </form>
  </div>
</div>
