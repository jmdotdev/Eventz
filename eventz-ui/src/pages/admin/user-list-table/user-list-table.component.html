<div class="px-5 pb-14 pt-6 sm:px-8">
  <app-admin-page-header title="Customers" subtitle="People who have bought tickets from Sondeka.">
    <button type="button" class="flex items-center gap-1.5 rounded-[10px] bg-brand px-4 py-2.5 text-[13.5px] font-bold text-white hover:bg-brand-hover">
      <ng-icon name="lucidePlus" size="14" />
      Add user
    </button>
  </app-admin-page-header>

  <app-admin-search-filter-bar
    placeholder="Search name or email"
    [searchValue]="search"
    (searchValueChange)="search = $event; currentPage = 1"
    [filters]="statusFilters"
    [activeFilter]="activeFilter()"
    (activeFilterChange)="setFilter($event)"
  />

  <div class="w-full overflow-x-auto rounded-[18px] border border-border-light bg-white">
    <table class="min-w-[860px] w-full text-left text-sm">
      <thead class="bg-surface-muted">
        <tr>
          <th class="px-6 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Name</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Email</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Status</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Date</th>
          <th class="px-6 py-3 text-right text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Actions</th>
        </tr>
      </thead>

      <tbody>
        @for (user of paginatedUsers; track user.email + $index; let i = $index) {
          <tr class="border-t border-divider hover:bg-surface-muted">
            <td class="px-6 py-3.5">
              <div class="flex items-center gap-3">
                <span class="flex h-[38px] w-[38px] shrink-0 items-center justify-center rounded-[11px] bg-brand-tint text-[13px] font-bold text-brand">{{ user.name.slice(0, 2) }}</span>
                <p class="font-bold text-text-primary">{{ user.name }}</p>
              </div>
            </td>
            <td class="px-4 py-3.5 text-text-body">{{ user.email }}</td>
            <td class="px-4 py-3.5"><app-status-badge [status]="user.active ? 'Active' : 'Inactive'" /></td>
            <td class="px-4 py-3.5 text-text-body">{{ user.date }}</td>

            <td class="px-6 py-3.5 text-right">
              <div class="relative inline-flex items-center gap-1.5">
                <button type="button" class="rounded-[9px] border border-border bg-white px-3 py-1.5 text-[12.5px] font-bold text-text-primary hover:border-border-hover">Profile</button>
                <button type="button" (click)="toggleMenu(i)" class="flex h-8 w-8 items-center justify-center rounded-[9px] border border-border bg-white text-text-tertiary hover:border-border-hover">
                  <ng-icon name="lucideEllipsisVertical" size="15" />
                </button>
                @if (openMenuIndex === i) {
                  <div class="absolute right-0 top-9 z-10 w-36 rounded-lg border border-border-light bg-white py-1 shadow-lg">
                    <button class="block w-full px-4 py-2 text-left text-[13px] hover:bg-surface-muted">View</button>
                    <button class="block w-full px-4 py-2 text-left text-[13px] text-error hover:bg-error-bg-soft">Deactivate</button>
                  </div>
                }
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <app-admin-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize" [totalItems]="filteredUsers.length" (pageChange)="changePage($event)" />
  </div>
</div>
