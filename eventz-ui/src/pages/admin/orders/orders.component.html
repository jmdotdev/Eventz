<div class="px-5 pb-14 pt-6 sm:px-8">
  <app-admin-page-header title="Orders" [subtitle]="orders().length + ' orders · ' + needsAttentionCount + ' need attention'">
    <button type="button" class="flex items-center gap-1.5 rounded-[10px] border border-border bg-white px-4 py-2.5 text-[13.5px] font-bold text-text-primary hover:border-border-hover">
      <ng-icon name="lucideDownload" size="14" />
      Export
    </button>
  </app-admin-page-header>

  @if (needsAttentionCount > 0) {
    <div class="mb-[18px]">
      <app-alert-banner
        tone="warning"
        title="Some orders need attention"
        [message]="needsAttentionCount + ' orders are pending M-Pesa confirmation or failed payment. Review them before they expire.'"
      >
        <button bannerAction type="button" class="whitespace-nowrap rounded-[10px] bg-warning-text px-4 py-2.5 text-[13px] font-bold text-white">Review orders</button>
      </app-alert-banner>
    </div>
  }

  <app-admin-search-filter-bar
    placeholder="Search order number, buyer or phone"
    [searchValue]="search"
    (searchValueChange)="search = $event; currentPage = 1"
    [filters]="statusFilters"
    [activeFilter]="activeFilter()"
    (activeFilterChange)="setFilter($event)"
  />

  <div class="w-full overflow-x-auto rounded-[18px] border border-border-light bg-white">
    <table class="min-w-[860px] w-full text-left text-sm">
      <thead class="bg-surface-muted">
        <tr>
          <th class="px-6 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Order</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Buyer</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Event</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Amount</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Status</th>
          <th class="px-6 py-3 text-right text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (order of paginatedOrders; track order.id) {
          <tr class="border-t border-divider hover:bg-surface-muted">
            <td class="px-6 py-3.5">
              <p class="font-mono font-bold text-text-primary">{{ order.id }}</p>
              <p class="text-[12px] text-text-tertiary">{{ order.date }}</p>
            </td>
            <td class="px-4 py-3.5">
              <p class="font-semibold text-text-primary">{{ order.buyer }}</p>
              <p class="text-[12px] text-text-tertiary">{{ order.phone }}</p>
            </td>
            <td class="px-4 py-3.5 text-text-body">{{ order.event }}</td>
            <td class="px-4 py-3.5 font-semibold text-text-primary">{{ formatPrice(order.amount) }}</td>
            <td class="px-4 py-3.5"><app-status-badge [status]="order.status" /></td>
            <td class="px-6 py-3.5 text-right">
              @if (order.status === 'Pending') {
                <button type="button" class="rounded-[9px] border border-brand-border bg-brand-tint px-3 py-1.5 text-[12.5px] font-bold text-brand">{{ actionLabel(order.status) }}</button>
              } @else {
                <button type="button" class="rounded-[9px] border border-border bg-white px-3 py-1.5 text-[12.5px] font-bold text-text-primary hover:border-border-hover">{{ actionLabel(order.status) }}</button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>

    <app-admin-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize" [totalItems]="filteredOrders.length" (pageChange)="changePage($event)" />
  </div>
</div>
