<div class="px-5 pb-14 pt-6 sm:px-8">
  <app-admin-page-header title="Tickets" subtitle="All ticket types sold across your events.">
    <button type="button" (click)="navigateToCreateTicket()" class="flex items-center gap-1.5 rounded-[10px] bg-brand px-4 py-2.5 text-[13.5px] font-bold text-white hover:bg-brand-hover">
      <ng-icon name="lucidePlus" size="14" />
      Create ticket
    </button>
  </app-admin-page-header>

  <app-admin-search-filter-bar
    placeholder="Search ticket number or event"
    [searchValue]="search"
    (searchValueChange)="search = $event; currentPage = 1"
    [filters]="statusFilters"
    [activeFilter]="activeFilter()"
    (activeFilterChange)="setFilter($event)"
  />

  <div class="w-full overflow-x-auto rounded-[18px] border border-border-light bg-white">
    <table class="min-w-[860px] w-full text-left text-sm">
      <thead class="bg-surface-muted">
        <tr>
          <th class="px-6 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Ticket no.</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Event</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Persons</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Status</th>
          <th class="px-4 py-3 text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Date booked</th>
          <th class="px-6 py-3 text-right text-[11.5px] font-bold uppercase tracking-[.07em] text-text-tertiary">Actions</th>
        </tr>
      </thead>

      <tbody>
        @for (ticket of paginatedTickets; track ticket.ticketNo; let i = $index) {
          <tr class="border-t border-divider hover:bg-surface-muted">
            <td class="px-6 py-3.5 font-mono font-semibold text-text-primary">{{ ticket.ticketNo }}</td>
            <td class="px-4 py-3.5 text-text-body">{{ ticket.event }}</td>
            <td class="px-4 py-3.5 text-text-body">{{ ticket.persons }}</td>
            <td class="px-4 py-3.5"><app-status-badge [status]="ticket.active ? 'Active' : 'Cancelled'" /></td>
            <td class="px-4 py-3.5 text-text-body">{{ ticket.dateBooked }}</td>

            <td class="px-6 py-3.5 text-right">
              <div class="relative inline-flex items-center gap-1.5">
                <button type="button" (click)="toggleMenu(i)" class="flex h-8 w-8 items-center justify-center rounded-[9px] border border-border bg-white text-text-tertiary hover:border-border-hover">
                  <ng-icon name="lucideEllipsisVertical" size="15" />
                </button>
                @if (openMenuIndex === i) {
                  <div class="absolute right-0 top-9 z-10 w-32 rounded-lg border border-border-light bg-white py-1 shadow-lg">
                    <button class="block w-full px-4 py-2 text-left text-[13px] text-error hover:bg-error-bg-soft">Revoke</button>
                  </div>
                }
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="px-6 py-8 text-center text-text-tertiary">No tickets found.</td>
          </tr>
        }
      </tbody>
    </table>

    <app-admin-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize" [totalItems]="filteredTickets.length" (pageChange)="changePage($event)" />
  </div>
</div>
