<div class="min-h-screen bg-surface-muted lg:grid lg:grid-cols-[246px_1fr]">
  <!-- Desktop sidenav -->
  <aside class="hidden border-r border-border-light lg:sticky lg:top-0 lg:block lg:h-screen lg:overflow-y-auto">
    <app-side-nav />
  </aside>

  <!-- Mobile top strip (menu toggle only — the design has no persistent top bar) -->
  <div class="sticky top-0 z-30 flex items-center gap-3 border-b border-border-light bg-white px-4 py-3 lg:hidden">
    <button type="button" (click)="toggleSideNav()" class="flex h-9 w-9 items-center justify-center rounded-lg hover:bg-brand-tint" aria-label="Open menu">
      <ng-icon name="lucideMenu" size="20" color="#12121A" />
    </button>
    <span class="flex h-[26px] w-[26px] items-center justify-center rounded-lg bg-brand text-xs font-extrabold text-white">E</span>
    <span class="text-[16px] font-extrabold text-text-primary">Eventz Admin</span>
  </div>

  <!-- Mobile backdrop -->
  @if (showSideNav()) {
    <div class="fixed inset-0 z-40 bg-black/50 lg:hidden" (click)="closeSideNav()"></div>
  }

  <!-- Mobile sidenav drawer -->
  <div
    class="fixed left-0 top-0 z-50 h-full w-72 transform bg-white transition-transform duration-300 lg:hidden"
    [class]="showSideNav() ? 'translate-x-0' : '-translate-x-full'"
  >
    <app-side-nav (linkClicked)="closeSideNav()" />
  </div>

  <!-- Main content -->
  <main class="min-w-0">
    <router-outlet></router-outlet>
  </main>
</div>
